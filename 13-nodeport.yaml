apiVersion: v1 
kind: Service 
metadata: 
  name: nginx-np 
spec: 
  type: NodePort 
  selector: 
    Project: expense 
    environment: dev 
    component: backend 
    version: "1.0.0"
    demo: node-port 
  ports: 
  - protocol: TCP 
    port: 80 
    targetPort: 80 

--- 
apiVersion: v1 
kind: Pod 
metadata: 
  name: backend-np 
  labels: 
    Project: expense 
    environment: dev 
    component: backend 
    version: "1.0.0"
    demo: node-port 
  spec: 
    containers: 
    - name: nginx 
      image: nginx 