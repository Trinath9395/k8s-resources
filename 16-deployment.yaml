apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: nginx 
  labels: 
    app: nginx 
    tier: web 
    purpose: deployment 
spec: 
  replicas: 3 
  selector: 
    matchLabels:
      app: nginx 
      tier: web 
      purpose: deployment 
  template: 
    metadata: 
      labels: 
        app: nginx 
        tier: web 
        purpose: deployment 
    spec: 
      containers: 
      - name: nginx 
        image: trinathr/deployment:1.0.0
        ports: 
        - containerPort: 80 

--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: nginx
spec: 
  type: LoadBalancer 
  selector: 
    app: nginx 
    tier: web 
    purpose: deployment 
  ports: 
  - protocol: TCP 
    port: 80 
    targetPort: 80 
    nodePort: 30007